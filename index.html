<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talkpod Modern Walkie-Talkie - 音声トランシーバー</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=VT323&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .font-lcd {
            font-family: 'VT323', monospace;
        }

        .font-tech {
            font-family: 'Chakra Petch', sans-serif;
        }

        /* Theme Color Definitions */
        .theme-yellow {
            --body-bg: linear-gradient(145deg, #ffc000, #ff9100);
            --body-border: #e07b00;
            --accent-shadow: rgba(255, 145, 0, 0.4);
        }
        .theme-purple {
            --body-bg: linear-gradient(145deg, #a855f7, #7e22ce);
            --body-border: #6b21a8;
            --accent-shadow: rgba(168, 85, 247, 0.4);
        }
        .theme-blue {
            --body-bg: linear-gradient(145deg, #38bdf8, #0284c7);
            --body-border: #0369a1;
            --accent-shadow: rgba(56, 189, 248, 0.4);
        }
        .theme-pink {
            --body-bg: linear-gradient(145deg, #f472b6, #db2777);
            --body-border: #be185d;
            --accent-shadow: rgba(244, 114, 182, 0.4);
        }

        .walkie-body {
            background: var(--body-bg);
            border: 4px solid var(--body-border);
            box-shadow: 0 20px 40px var(--accent-shadow), inset 0 3px 6px rgba(255,255,255,0.4);
            border-radius: 90px 90px 70px 70px;
        }

        .face-plate {
            background-color: #ffffff;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06), 0 6px 12px rgba(0,0,0,0.15);
            border-radius: 50px 50px 60px 60px;
        }

        .lcd-screen {
            background: linear-gradient(135deg, #d3dad1 0%, #bac4b8 100%);
            border: 3px solid #8e9b8b;
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.25);
            color: #1a221a;
        }

        .side-ptt-btn {
            background: linear-gradient(90deg, #f3f4f6 0%, #e5e7eb 100%);
            box-shadow: -4px 4px 8px rgba(0,0,0,0.25), inset 0 2px 2px rgba(255,255,255,0.8);
            border: 2px solid #cbd5e1;
            transition: all 0.1s ease;
        }

        .side-ptt-btn:active, .side-ptt-btn.active {
            transform: translateX(4px) scale(0.98);
            background: #d1d5db;
            box-shadow: -1px 2px 4px rgba(0,0,0,0.3);
        }

        .speaker-dots {
            background-image: radial-gradient(#334155 35%, transparent 35%);
            background-size: 8px 8px;
            background-position: 0 0;
        }

        .front-btn {
            background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
            box-shadow: 0 3px 0 #cbd5e1, 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.08s ease;
        }

        .front-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #cbd5e1, 0 2px 3px rgba(0,0,0,0.1);
        }

        .led-tx { background-color: #ef4444; box-shadow: 0 0 10px #ef4444; }
        .led-rx { background-color: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .led-off { background-color: #94a3b8; }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex flex-col items-center justify-center p-3 select-none theme-yellow">

    <div id="auth-modal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800/90 border border-slate-700 rounded-3xl p-6 max-w-xs w-full text-center shadow-2xl space-y-4">
            <div class="w-16 h-16 bg-amber-500/20 text-amber-400 rounded-2xl flex items-center justify-center mx-auto border border-amber-500/30 text-2xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div>
                <h2 class="text-xl font-bold text-white font-tech">Talkpod Security</h2>
                <p class="text-slate-400 text-xs mt-1">初回起動時のパスワード入力が必要です</p>
            </div>
            <form id="auth-form" class="space-y-3" onsubmit="handleAuth(event)">
                <div>
                    <input type="password" id="auth-pass" placeholder="PASSWORD" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-center text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 text-sm tracking-widest font-mono">
                    <p id="auth-error" class="text-xs text-red-400 mt-1.5 hidden font-tech">パスワードが正しくありません</p>
                </div>
                <button type="submit" class="w-full py-3 bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 font-bold rounded-xl hover:from-amber-300 hover:to-amber-400 transition shadow-lg text-sm font-tech">
                    アクセス開始
                </button>
            </form>
        </div>
    </div>

    <div class="w-full max-w-sm flex flex-col items-center">
        
        <header class="w-full flex justify-between items-center mb-3 px-2 text-xs text-slate-300 font-tech">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-walkie-talkie text-amber-400 text-base"></i>
                <span class="font-bold tracking-wide">TALKPOD MINI PRO</span>
            </div>
            <div class="flex items-center gap-1.5 bg-slate-800/80 px-2 py-1 rounded-full border border-slate-700">
                <button onclick="setTheme('theme-yellow')" class="w-4 h-4 rounded-full bg-amber-400 hover:scale-110 transition border border-white/50" title="Yellow"></button>
                <button onclick="setTheme('theme-purple')" class="w-4 h-4 rounded-full bg-purple-500 hover:scale-110 transition border border-white/50" title="Purple"></button>
                <button onclick="setTheme('theme-blue')" class="w-4 h-4 rounded-full bg-sky-400 hover:scale-110 transition border border-white/50" title="Blue"></button>
                <button onclick="setTheme('theme-pink')" class="w-4 h-4 rounded-full bg-pink-400 hover:scale-110 transition border border-white/50" title="Pink"></button>
            </div>
        </header>

        <div class="relative w-72 sm:w-80 walkie-body p-4 pt-1 flex flex-col items-center">
            
            <!-- Antenna -->
            <div class="absolute -top-12 right-10 w-8 h-14 bg-white/90 rounded-t-full border-t-2 border-slate-300 shadow-md flex items-center justify-center">
                <div class="w-5 h-10 bg-slate-200 rounded-t-full border-t border-slate-300"></div>
            </div>

            <!-- Left Textured PTT Side Button -->
            <button id="side-ptt" class="side-ptt-btn absolute -left-5 top-28 w-6 h-36 rounded-l-2xl flex flex-col items-center justify-center gap-2 cursor-pointer z-20">
                <div class="w-2.5 h-1.5 bg-slate-300 rounded-full"></div>
                <div class="w-2.5 h-1.5 bg-slate-300 rounded-full"></div>
                <div class="w-2.5 h-1.5 bg-slate-300 rounded-full"></div>
                <div class="w-2.5 h-1.5 bg-slate-300 rounded-full"></div>
                <div class="w-2.5 h-1.5 bg-slate-300 rounded-full"></div>
                <div class="w-2.5 h-1.5 bg-slate-300 rounded-full"></div>
            </button>

            <!-- Status Indicator LED -->
            <div class="w-full flex justify-between items-center px-6 pt-2 pb-1">
                <div id="tx-rx-led" class="w-3.5 h-3.5 rounded-full led-off transition-all mx-auto"></div>
            </div>

            <div class="w-full face-plate p-4 flex flex-col items-center border border-slate-100">
                
                <div class="text-center font-bold tracking-wider text-slate-800 text-lg mb-2 font-tech">
                    Talkpod
                </div>

                <!-- Digital LCD Panel -->
                <div class="w-full lcd-screen rounded-2xl p-2.5 mb-3 flex flex-col justify-between relative overflow-hidden font-lcd">
                    
                    <div class="flex justify-between items-center text-slate-800 text-sm border-b border-slate-400/40 pb-1 leading-none">
                        <div class="flex items-center gap-1.5">
                            <i id="signal-icon" class="fa-solid fa-signal text-xs"></i>
                            <div class="flex items-center gap-1 bg-slate-400/20 px-1 rounded">
                                <i id="speaker-icon" class="fa-solid fa-volume-high text-xs"></i>
                                <span id="lcd-vol" class="text-[11px] font-bold font-tech">V5</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-1">
                            <span id="vox-indicator" class="text-[11px] font-bold font-tech opacity-40">VOX</span>
                            <i id="battery-icon" class="fa-solid fa-battery-full text-xs"></i>
                        </div>
                    </div>

                    <!-- Channel & Sub-Code -->
                    <div class="flex justify-between items-center my-1 px-1">
                        <div class="flex flex-col text-slate-700">
                            <span class="text-[10px] font-tech font-bold leading-tight">SUB CODE</span>
                            <span id="lcd-subcode" class="text-xl font-bold leading-none">00</span>
                        </div>

                        <div class="flex flex-col items-end">
                            <span id="lcd-setting-label" class="text-[10px] font-tech font-bold leading-tight text-amber-800">CHANNEL</span>
                            <span id="lcd-channel" class="text-5xl font-black tracking-tight leading-none">01</span>
                        </div>
                    </div>

                    <div class="flex justify-between items-center text-[11px] font-tech border-t border-slate-400/40 pt-1 text-slate-700">
                        <span id="lcd-ch-name" class="font-bold truncate max-w-[130px]">CH 01: GENERAL OPEN</span>
                        <span id="lcd-mode" class="font-bold bg-slate-400/30 px-1 rounded">P2P</span>
                    </div>
                </div>

                <!-- Volume Direct Control Bar -->
                <div class="w-full flex items-center justify-between bg-slate-100 rounded-xl px-2 py-1 mb-2 border border-slate-200 text-xs font-tech">
                    <span class="text-slate-500 font-bold text-[10px]">VOLUME</span>
                    <div class="flex items-center gap-1">
                        <button id="btn-vol-down" class="w-7 h-6 bg-slate-200 hover:bg-slate-300 rounded text-slate-700 font-bold active:scale-95 flex items-center justify-center">
                            <i class="fa-solid fa-minus text-[10px]"></i>
                        </button>
                        <div id="vol-bar-dots" class="flex gap-0.5 px-1">
                            <div class="w-1.5 h-3 bg-amber-500 rounded-sm"></div>
                            <div class="w-1.5 h-3 bg-amber-500 rounded-sm"></div>
                            <div class="w-1.5 h-3 bg-amber-500 rounded-sm"></div>
                            <div class="w-1.5 h-3 bg-amber-500 rounded-sm"></div>
                            <div class="w-1.5 h-3 bg-amber-500 rounded-sm"></div>
                            <div class="w-1.5 h-3 bg-slate-300 rounded-sm"></div>
                            <div class="w-1.5 h-3 bg-slate-300 rounded-sm"></div>
                            <div class="w-1.5 h-3 bg-slate-300 rounded-sm"></div>
                        </div>
                        <button id="btn-vol-up" class="w-7 h-6 bg-slate-200 hover:bg-slate-300 rounded text-slate-700 font-bold active:scale-95 flex items-center justify-center">
                            <i class="fa-solid fa-plus text-[10px]"></i>
                        </button>
                    </div>
                </div>

                <!-- Front Keypad -->
                <div class="w-full grid grid-cols-4 gap-2 my-1">
                    <button id="btn-menu" class="front-btn h-11 rounded-xl flex flex-col items-center justify-center text-slate-700 text-xs font-bold active:scale-95" title="Menu Mode (CH / VOL)">
                        <i class="fa-solid fa-bars text-xs"></i>
                        <span id="menu-mode-tag" class="text-[8px] font-tech text-amber-600 font-bold">CH/VOL</span>
                    </button>

                    <button id="btn-up" class="front-btn h-11 rounded-xl flex items-center justify-center text-slate-700 text-base font-black active:scale-95" title="Up">
                        <i class="fa-solid fa-caret-up"></i>
                    </button>

                    <button id="btn-down" class="front-btn h-11 rounded-xl flex items-center justify-center text-slate-700 text-base font-black active:scale-95" title="Down">
                        <i class="fa-solid fa-caret-down"></i>
                    </button>

                    <button id="btn-scan" class="front-btn h-11 rounded-xl flex flex-col items-center justify-center text-slate-700 text-xs font-bold active:scale-95" title="Scan / Lock">
                        <i class="fa-solid fa-arrows-split-up-and-left text-xs"></i>
                        <i id="lock-icon" class="fa-solid fa-lock-open text-[9px] -mt-0.5"></i>
                    </button>
                </div>

                <!-- Speaker Grille with Canvas Visualizer -->
                <div class="w-full h-28 speaker-dots rounded-2xl my-2 border border-slate-200/60 relative overflow-hidden flex items-center justify-center">
                    <canvas id="audio-wave-canvas" class="w-full h-full absolute inset-0 opacity-50 pointer-events-none"></canvas>
                    <div id="speaker-status" class="text-[10px] font-tech text-slate-600 bg-white/90 px-2.5 py-1 rounded-full font-bold shadow-sm z-10 border border-slate-200">
                        HOLD SIDE BUTTON OR SPACE TO TALK
                    </div>
                </div>

            </div>

            <!-- Mobile Main Touch PTT Banner -->
            <button id="main-ptt-touch" class="w-full mt-3 py-3 bg-white/20 hover:bg-white/30 rounded-full text-white text-xs font-bold tracking-wider font-tech flex items-center justify-center gap-2 border border-white/30 active:scale-95 transition">
                <i class="fa-solid fa-microphone text-sm"></i>
                <span>HOLD SIDE / TAP HERE TO TALK</span>
            </button>

        </div>

        <!-- Transcript Log Card -->
        <div class="w-full mt-4 bg-slate-800/90 border border-slate-700 rounded-2xl p-3 shadow-xl">
            <div class="flex justify-between items-center mb-2 pb-1 border-b border-slate-700 text-xs font-tech">
                <span class="text-slate-300 font-bold flex items-center gap-1.5">
                    <i class="fa-solid fa-comments text-amber-400"></i>
                    TRANSCRIPT LOG
                </span>
                <div class="flex items-center gap-3">
                    <button id="btn-clear-log" class="text-slate-400 hover:text-slate-200 text-[11px] underline">Clear Log</button>
                    <button id="btn-logout" onclick="logoutAuth()" class="text-red-400 hover:text-red-300 text-[11px] underline flex items-center gap-1">
                        <i class="fa-solid fa-lock text-[10px]"></i> Lock
                    </button>
                </div>
            </div>
            
            <div id="log-container" class="h-24 overflow-y-auto space-y-1.5 text-xs font-tech text-slate-300 pr-1">
                <div class="text-slate-500 italic text-[11px]">Radio ready. Channel standard mode active.</div>
            </div>
        </div>

        <footer class="mt-3 text-center text-[11px] text-slate-400 font-tech">
            <span>Talkpod Walkie-Talkie • Web Audio Bandpass & P2P Filter</span>
        </footer>

    </div>

    <script>
        const CHANNELS = [
            { id: 1, sub: "00", name: "CH 01: GENERAL OPEN", mode: "P2P" },
            { id: 2, sub: "05", name: "CH 02: BASE DISPATCH", mode: "P2P" },
            { id: 3, sub: "01", name: "CH 03: TEAM ALPHA", mode: "P2P" },
            { id: 4, sub: "12", name: "CH 04: TEAM BRAVO", mode: "P2P" },
            { id: 5, sub: "18", name: "CH 05: EMERGENCY REPT", mode: "P2P" },
            { id: 6, sub: "24", name: "CH 06: HIKE ROUTE 1", mode: "P2P" },
            { id: 7, sub: "38", name: "CH 07: HIKE ROUTE 2", mode: "P2P" },
            { id: 8, sub: "01", name: "CH 08: MOUNTAIN RELAY", mode: "P2P" },
            { id: 9, sub: "00", name: "CH 09: CAMP MAIN", mode: "P2P" },
            { id: 10, sub: "05", name: "CH 10: KITCHEN CREW", mode: "P2P" },
            { id: 11, sub: "12", name: "CH 11: SCOUT PATROL", mode: "P2P" },
            { id: 12, sub: "00", name: "CH 12: CENTRAL CONTROL", mode: "P2P" },
            { id: 13, sub: "18", name: "CH 13: LOGISTICS", mode: "P2P" },
            { id: 14, sub: "24", name: "CH 14: EVENT HQ", mode: "P2P" },
            { id: 15, sub: "38", name: "CH 15: SECURITY 1", mode: "P2P" },
            { id: 16, sub: "01", name: "CH 16: SECURITY 2", mode: "P2P" },
            { id: 17, sub: "05", name: "CH 17: VEHICLE COMM", mode: "P2P" },
            { id: 18, sub: "18", name: "CH 18: RESCUE ALPHA", mode: "P2P" },
            { id: 19, sub: "12", name: "CH 19: CONVOY CH", mode: "P2P" },
            { id: 20, sub: "24", name: "CH 20: MEDICAL STATION", mode: "P2P" },
            { id: 21, sub: "38", name: "CH 21: NIGHT WATCH", mode: "P2P" },
            { id: 22, sub: "01", name: "CH 22: AIR MONITOR", mode: "P2P" },
            { id: 23, sub: "05", name: "CH 23: BACKUP LINE", mode: "P2P" },
            { id: 24, sub: "00", name: "CH 24: COMMAND CENTER", mode: "P2P" }
        ];

        let currentChannelIdx = 0;
        let currentVolume = 5; // 0 to 8
        let controlMode = 'CH'; // 'CH' or 'VOL'
        let isTransmitting = false;
        let isKeyLocked = false;
        let myClientId = 'RAD-' + Math.floor(1000 + Math.random() * 9000);

        // Web Audio API Elements
        let audioCtx = null;
        let masterGainNode = null;
        let micStream = null;
        let micSource = null;
        let bandpassLow = null;
        let bandpassHigh = null;
        let analyser = null;
        let staticNoiseNode = null;
        let staticGainNode = null;

        // Multi-tab P2P Communication
        let broadcastChan = null;

        // Speech Recognition
        let recognition = null;
        let currentTranscript = "";

        function checkAuth() {
            const isAuth = localStorage.getItem('talkpod_auth');
            const modal = document.getElementById('auth-modal');
            if (isAuth === 'true') {
                if (modal) modal.classList.add('hidden');
            } else {
                if (modal) modal.classList.remove('hidden');
            }
        }

        function handleAuth(e) {
            e.preventDefault();
            const inputPass = document.getElementById('auth-pass').value;
            const errorEl = document.getElementById('auth-error');
            
            if (inputPass === 'keigo') {
                localStorage.setItem('talkpod_auth', 'true');
                document.getElementById('auth-modal').classList.add('hidden');
                initAudioContext();
                addLog('認証完了。トランシーバーが利用可能です。', 'sys');
            } else {
                errorEl.classList.remove('hidden');
                document.getElementById('auth-pass').value = '';
            }
        }

        function logoutAuth() {
            localStorage.removeItem('talkpod_auth');
            location.reload();
        }

        function setTheme(themeName) {
            document.body.className = `bg-slate-900 text-slate-800 min-h-screen flex flex-col items-center justify-center p-3 select-none ${themeName}`;
        }

        function initAudioContext() {
            if (audioCtx) return;
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContextClass();

            // Master Gain Node for Volume Control
            masterGainNode = audioCtx.createGain();
            masterGainNode.connect(audioCtx.destination);
            updateVolumeGain();

            // Analyser for visualizer
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;

            // Static background noise
            setupBackgroundStaticNoise();

            // Broadcast channel for multi-tab
            try {
                broadcastChan = new BroadcastChannel('talkpod_radio_network');
                broadcastChan.onmessage = handleIncomingBroadcast;
            } catch (err) {
                console.warn('BroadcastChannel not supported', err);
            }

            // Speech Recognition initialization
            initSpeechRecognition();
        }

        function updateVolumeGain() {
            if (masterGainNode && audioCtx) {
                const gainVal = currentVolume / 8;
                masterGainNode.gain.setValueAtTime(gainVal, audioCtx.currentTime);
            }
        }

        function changeVolume(delta) {
            if (isKeyLocked) return;
            playKeyClickSound();
            currentVolume = Math.max(0, Math.min(8, currentVolume + delta));
            
            updateVolumeGain();
            updateVolumeDisplay();
            addLog(`音量変更: VOL ${currentVolume}`, 'sys');
        }

        function updateVolumeDisplay() {
            const volEl = document.getElementById('lcd-vol');
            const spkIcon = document.getElementById('speaker-icon');
            const dots = document.getElementById('vol-bar-dots').children;

            if (volEl) volEl.innerText = `V${currentVolume}`;

            if (spkIcon) {
                if (currentVolume === 0) {
                    spkIcon.className = 'fa-solid fa-volume-xmark text-xs text-red-600 animate-pulse';
                } else if (currentVolume <= 3) {
                    spkIcon.className = 'fa-solid fa-volume-low text-xs';
                } else {
                    spkIcon.className = 'fa-solid fa-volume-high text-xs';
                }
            }

            // Update Volume Dots Bar
            if (dots) {
                for (let i = 0; i < dots.length; i++) {
                    if (i < currentVolume) {
                        dots[i].className = 'w-1.5 h-3 bg-amber-500 rounded-sm';
                    } else {
                        dots[i].className = 'w-1.5 h-3 bg-slate-300 rounded-sm';
                    }
                }
            }
        }

        function toggleControlMode() {
            if (isKeyLocked) return;
            playKeyClickSound();
            controlMode = (controlMode === 'CH') ? 'VOL' : 'CH';
            
            const label = document.getElementById('lcd-setting-label');
            const modeTag = document.getElementById('menu-mode-tag');

            if (controlMode === 'VOL') {
                label.innerText = 'SET VOL';
                label.className = 'text-[10px] font-tech font-bold leading-tight text-red-600 animate-pulse';
                modeTag.innerText = 'MODE:VOL';
                addLog('操作モード: 音量調整 (▲▼でVOL変更)', 'sys');
            } else {
                label.innerText = 'CHANNEL';
                label.className = 'text-[10px] font-tech font-bold leading-tight text-amber-800';
                modeTag.innerText = 'CH/VOL';
                addLog('操作モード: チャンネル切替 (▲▼でCH変更)', 'sys');
            }
        }

        function setupBackgroundStaticNoise() {
            if (!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 2;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            staticNoiseNode = audioCtx.createBufferSource();
            staticNoiseNode.buffer = noiseBuffer;
            staticNoiseNode.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1200;
            filter.Q.value = 1.0;

            staticGainNode = audioCtx.createGain();
            staticGainNode.gain.value = 0.005; // Soft ambient radio static

            staticNoiseNode.connect(filter);
            filter.connect(staticGainNode);
            staticGainNode.connect(masterGainNode || audioCtx.destination);
            staticNoiseNode.start();
        }

        function playRogerBeep() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc1.type = 'sine';
            osc2.type = 'sine';

            osc1.frequency.setValueAtTime(1200, now);
            osc2.frequency.setValueAtTime(1800, now + 0.07);

            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(masterGainNode || audioCtx.destination);

            osc1.start(now);
            osc1.stop(now + 0.07);
            osc2.start(now + 0.07);
            osc2.stop(now + 0.15);
        }

        function playKeyClickSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, now);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

            osc.connect(gain);
            gain.connect(masterGainNode || audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.04);
        }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'ja-JP';

                recognition.onresult = (event) => {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        transcript += event.results[i][0].transcript;
                    }
                    currentTranscript = transcript;
                };

                recognition.onerror = (e) => {
                    console.log('Speech recognition error', e);
                };
            }
        }

        async function startTransmission() {
            if (isTransmitting || isKeyLocked) return;
            if (localStorage.getItem('talkpod_auth') !== 'true') return;

            initAudioContext();
            if (audioCtx && audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            isTransmitting = true;
            currentTranscript = "";

            // UI Updates
            document.getElementById('tx-rx-led').className = 'w-3.5 h-3.5 rounded-full led-tx transition-all mx-auto';
            document.getElementById('side-ptt').classList.add('active');
            document.getElementById('speaker-status').innerText = 'TRANSMITTING... (SPEAK NOW)';
            document.getElementById('speaker-status').className = 'text-[10px] font-tech text-red-600 bg-red-100 px-2.5 py-1 rounded-full font-bold shadow-sm z-10 border border-red-300 animate-pulse';

            // Audio routing for mic with Bandpass radio filter
            try {
                if (!micStream) {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                }
                micSource = audioCtx.createMediaStreamSource(micStream);

                bandpassLow = audioCtx.createBiquadFilter();
                bandpassLow.type = 'highpass';
                bandpassLow.frequency.value = 350;

                bandpassHigh = audioCtx.createBiquadFilter();
                bandpassHigh.type = 'lowpass';
                bandpassHigh.frequency.value = 3000;

                micSource.connect(bandpassLow);
                bandpassLow.connect(bandpassHigh);
                bandpassHigh.connect(analyser);

                if (staticGainNode) staticGainNode.gain.value = 0.02; // Elevated static while transmitting

            } catch (err) {
                console.error('Microphone access denied', err);
            }

            if (recognition) {
                try { recognition.start(); } catch(e){}
            }
        }

        function stopTransmission() {
            if (!isTransmitting) return;
            isTransmitting = false;

            // UI Reset
            document.getElementById('tx-rx-led').className = 'w-3.5 h-3.5 rounded-full led-off transition-all mx-auto';
            document.getElementById('side-ptt').classList.remove('active');
            document.getElementById('speaker-status').innerText = 'HOLD SIDE BUTTON OR SPACE TO TALK';
            document.getElementById('speaker-status').className = 'text-[10px] font-tech text-slate-600 bg-white/90 px-2.5 py-1 rounded-full font-bold shadow-sm z-10 border border-slate-200';

            if (staticGainNode) staticGainNode.gain.value = 0.005;

            if (recognition) {
                try { recognition.stop(); } catch(e){}
            }

            playRogerBeep();

            setTimeout(() => {
                const messageText = currentTranscript.trim() || "「感度良好、オーバー」";
                const activeCh = CHANNELS[currentChannelIdx];

                addLog(`送信 (${activeCh.name}): ${messageText}`, 'tx');

                // Broadcast to other tabs
                if (broadcastChan) {
                    broadcastChan.postMessage({
                        type: 'RADIO_MSG',
                        channelId: activeCh.id,
                        sender: myClientId,
                        text: messageText
                    });
                }
            }, 200);
        }

        function handleIncomingBroadcast(event) {
            const data = event.data;
            if (!data || data.type !== 'RADIO_MSG') return;

            const activeCh = CHANNELS[currentChannelIdx];
            if (data.channelId === activeCh.id && data.sender !== myClientId) {
                document.getElementById('tx-rx-led').className = 'w-3.5 h-3.5 rounded-full led-rx transition-all mx-auto';
                playRogerBeep();
                addLog(`受信 (${activeCh.name}): ${data.text}`, 'rx');

                if ('speechSynthesis' in window && currentVolume > 0) {
                    const utter = new SpeechSynthesisUtterance(data.text);
                    utter.lang = 'ja-JP';
                    utter.pitch = 0.9;
                    utter.volume = currentVolume / 8; // Adjust speech volume
                    window.speechSynthesis.speak(utter);
                }

                setTimeout(() => {
                    document.getElementById('tx-rx-led').className = 'w-3.5 h-3.5 rounded-full led-off transition-all mx-auto';
                }, 1500);
            }
        }

        function updateChannelDisplay() {
            const ch = CHANNELS[currentChannelIdx];
            document.getElementById('lcd-channel').innerText = ch.id < 10 ? '0' + ch.id : ch.id;
            document.getElementById('lcd-subcode').innerText = ch.sub;
            document.getElementById('lcd-ch-name').innerText = ch.name;
            document.getElementById('lcd-mode').innerText = ch.mode;
        }

        function changeChannel(delta) {
            if (isKeyLocked) return;
            playKeyClickSound();
            currentChannelIdx = (currentChannelIdx + delta + CHANNELS.length) % CHANNELS.length;
            updateChannelDisplay();
            addLog(`チャンネル変更: ${CHANNELS[currentChannelIdx].name}`, 'sys');
        }

        function toggleLock() {
            isKeyLocked = !isKeyLocked;
            playKeyClickSound();
            const lockIcon = document.getElementById('lock-icon');
            if (isKeyLocked) {
                lockIcon.className = 'fa-solid fa-lock text-[9px] -mt-0.5 text-red-600';
                addLog('キーパッドをロックしました', 'sys');
            } else {
                lockIcon.className = 'fa-solid fa-lock-open text-[9px] -mt-0.5';
                addLog('キーパッドのロックを解除しました', 'sys');
            }
        }

        function addLog(msg, type) {
            const logContainer = document.getElementById('log-container');
            const entry = document.createElement('div');
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            let badgeClass = "bg-slate-700 text-slate-300";
            if (type === 'tx') badgeClass = "bg-amber-500/20 text-amber-400 border border-amber-500/30";
            if (type === 'rx') badgeClass = "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
            if (type === 'sys') badgeClass = "bg-slate-700/60 text-slate-400";

            entry.className = `flex items-start gap-2 text-[11px] font-tech`;
            entry.innerHTML = `<span class="text-slate-500 font-mono text-[10px] shrink-0 pt-0.5">[${timeStr}]</span>
                               <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${badgeClass} break-all">${msg}</span>`;
            
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function startVisualizer() {
            const canvas = document.getElementById('audio-wave-canvas');
            const ctx = canvas.getContext('2d');

            function draw() {
                requestAnimationFrame(draw);
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (analyser && isTransmitting) {
                    const bufferLength = analyser.frequencyBinCount;
                    const dataArray = new Uint8Array(bufferLength);
                    analyser.getByteFrequencyData(dataArray);

                    const barWidth = (canvas.width / bufferLength) * 1.5;
                    let x = 0;

                    for (let i = 0; i < bufferLength; i++) {
                        const barHeight = (dataArray[i] / 255) * canvas.height;
                        ctx.fillStyle = '#ef4444';
                        ctx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);
                        x += barWidth;
                    }
                } else {
                    // Subtle Idle Wave
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(51, 65, 85, 0.2)';
                    ctx.lineWidth = 1.5;
                    const time = Date.now() * 0.003;
                    for (let x = 0; x < canvas.width; x += 5) {
                        const y = canvas.height / 2 + Math.sin(x * 0.05 + time) * 3;
                        if (x === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }
            }
            draw();
        }

        function handleUpButton() {
            if (controlMode === 'CH') {
                changeChannel(1);
            } else {
                changeVolume(1);
            }
        }

        function handleDownButton() {
            if (controlMode === 'CH') {
                changeChannel(-1);
            } else {
                changeVolume(-1);
            }
        }

        function setupEventListeners() {
            const sidePtt = document.getElementById('side-ptt');
            const mainPttTouch = document.getElementById('main-ptt-touch');

            // Mouse / Touch PTT Events
            const startPtt = (e) => { e.preventDefault(); startTransmission(); };
            const stopPtt = (e) => { e.preventDefault(); stopTransmission(); };

            sidePtt.addEventListener('mousedown', startPtt);
            sidePtt.addEventListener('mouseup', stopPtt);
            sidePtt.addEventListener('touchstart', startPtt);
            sidePtt.addEventListener('touchend', stopPtt);

            mainPttTouch.addEventListener('mousedown', startPtt);
            mainPttTouch.addEventListener('mouseup', stopPtt);
            mainPttTouch.addEventListener('touchstart', startPtt);
            mainPttTouch.addEventListener('touchend', stopPtt);

            // Keypad buttons
            document.getElementById('btn-up').addEventListener('click', handleUpButton);
            document.getElementById('btn-down').addEventListener('click', handleDownButton);
            document.getElementById('btn-scan').addEventListener('click', toggleLock);
            document.getElementById('btn-menu').addEventListener('click', toggleControlMode);

            // Direct Volume Bar Control Buttons
            document.getElementById('btn-vol-up').addEventListener('click', () => changeVolume(1));
            document.getElementById('btn-vol-down').addEventListener('click', () => changeVolume(-1));

            document.getElementById('btn-clear-log').addEventListener('click', () => {
                document.getElementById('log-container').innerHTML = '';
            });

            // Keyboard Spacebar PTT
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' && !e.repeat && document.activeElement.tagName !== 'INPUT') {
                    e.preventDefault();
                    startTransmission();
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') {
                    e.preventDefault();
                    stopTransmission();
                }
            });
        }

        window.addEventListener('load', () => {
            checkAuth();
            setupEventListeners();
            updateChannelDisplay();
            updateVolumeDisplay();
            startVisualizer();
            
            const unlockAudio = () => {
                if (localStorage.getItem('talkpod_auth') === 'true') {
                    initAudioContext();
                }
                window.removeEventListener('click', unlockAudio);
                window.removeEventListener('keydown', unlockAudio);
            };
            window.addEventListener('click', unlockAudio);
            window.addEventListener('keydown', unlockAudio);
        });
    </script>
